version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newtonite
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: newtonite_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://newtonite:newtonite_dev@db:5432/newtonite
      JWT_SECRET: change_this_secret_in_production_min_32_chars
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node -r dotenv/config prisma/seed.js && npm run start"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://newtonite:newtonite_dev@db:5432/newtonite
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    command: node -r dotenv/config worker/outbox.worker.js

volumes:
  pgdata:
